version: '3.8'

services:
  cutshon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cutshon-web
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - cutshon_uploads:/app/uploads
      - cutshon_output:/app/output
    environment:
      - NODE_ENV=production

volumes:
  cutshon_uploads:
  cutshon_output:
